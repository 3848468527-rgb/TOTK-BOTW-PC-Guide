# totk.ini — 王国之泪 PC 原生版配置模板 (2K / 60 FPS 稳定版)
# 作者: DeliKitch | 适用: TotK-Recomp 0.3.1+ / 游戏 1.4.3
# 60 帧功耗更低、帧时间更稳；适合笔记本/长时间游玩/使用小黄鸭插帧(60->120/180)。

[frame rate]
fps_limit = 60
realtime = 1
cloth_realtime = 1
highfps_fix = 1

[performance]
async_preempt = 1
replay_async = 0
free_cores = 0
timer_1ms = 1
pipe_wait = default
pipe_skip = fullscreen
lib_prebuild = 1
lib_prebuild_threads = 4
pipe_prebuild = 1
prewarm_xlate = 12
gpl = 1
astc = auto
memory = auto
tex_alias = 1
zstd_native = 1
zstd_check = 0
lod_guard = 1
fix_c0 = 1
fix_zero = 1
bind_skip = 1
shader_memo = 1
pipe_memo = 1
tex_memo = 1
desc_template = 1
push_skip = 1
split_draws = 64
split_us = 1000
vk_validation = 0
vk_recorder = 1
vk_dyn_vertex = 1
vk_dyn_a2c = 1
vk_subgroup_pin = 1

[display]
device_profile = desktop
vk_present = mailbox
window_size = 2560x1440
fullscreen = 1
assume_focus = 1
perf_overlay = fps
gpu_name = NVIDIA
output_res = 2560x1440
render_scale = 100
upscaler = fsr
sharpness = 80
aspect = fit
fov = 100
aniso = 16
color_preset = default
shadow_res = 1024
shadow_scale = 1
shadow_range = 100
contact_shadows = 0
pcss = 0
dlaa = 0
dlss = quality
fxaa = 0
gpu_index = 0

[language]
lang = zh-Hans
locale = zh-CN
operation_mode = docked
menu_lang = zh-Hans

[input]
pad_layout = nintendo
motion = 1
rumble = 1
stick_deadzone = 8

[mods]
mods_rebuild = auto