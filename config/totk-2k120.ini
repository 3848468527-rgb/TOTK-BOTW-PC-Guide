# totk.ini — 王国之泪 PC 原生版配置模板 (2K / 120 FPS)
# 作者: DeliKitch | 适用: TotK-Recomp 0.3.1+ / 游戏 1.4.3
# 用法: 复制到游戏目录(totk.exe 同目录)覆盖 totk.ini，或运行 scripts/apply-totk-config.ps1
# 游戏内按 F1 可随时修改，菜单会把改动写回本文件。
# 如果机器性能不足: fps_limit 改 60，或 dlss 改 balanced，或 shadow_scale = 1。

[frame rate]
fps_limit = 120        ; 2K 下 120 帧；180Hz 屏也可 144/165；想稳可 60
realtime = 1           ; 高帧率必须开(真实时间步进)
cloth_realtime = 1     ; 布料物理随帧率实时
highfps_fix = 1        ; 高帧率修复(动画/物理)

[performance]
async_preempt = 1
replay_async = 0
free_cores = 0         ; 保持 0(设 1 可能崩溃)
timer_1ms = 1          ; 1ms 计时器，帧时间更稳
pipe_wait = default
pipe_skip = fullscreen
lib_prebuild = 1
lib_prebuild_threads = 4
pipe_prebuild = 1
prewarm_xlate = 12
gpl = 1                ; 图形管线库(着色器预构建)，减少卡顿
astc = auto            ; 纹理解码: auto/gpu/native/cpu
memory = auto
tex_alias = 1
zstd_native = 1
zstd_check = 0
lod_guard = 1
fix_c0 = 1
fix_zero = 1
bind_skip = 1
shader_memo = 1
pipe_memo = 1
tex_memo = 1
desc_template = 1
push_skip = 1
split_draws = 64
split_us = 1000
vk_validation = 0
vk_recorder = 1
vk_dyn_vertex = 1
vk_dyn_a2c = 1
vk_subgroup_pin = 1

[display]
device_profile = desktop
vk_present = mailbox   ; 垂直同步(三缓冲)；想更低延迟可 immediate
window_size = 2560x1440
fullscreen = 1
assume_focus = 1
perf_overlay = fps     ; F10 切换: off/fps/full
gpu_name = NVIDIA
output_res = 2560x1440
render_scale = 100
upscaler = fsr         ; 窗口缩放(输出=窗口时基本不用)
sharpness = 80
aspect = fit           ; 宽屏选 stretch / fit
fov = 100
aniso = 16
color_preset = default
shadow_res = 1024
shadow_scale = 2
shadow_range = 150
contact_shadows = 0
pcss = 0
dlaa = 0
dlss = quality         ; DLSS 质量: 3D 场景 67% 渲染后超分，最锐利
fxaa = 0
gpu_index = 0

[language]
lang = zh-Hans
locale = zh-CN
operation_mode = docked
menu_lang = zh-Hans

[input]
pad_layout = nintendo
motion = 1
rumble = 1
stick_deadzone = 8

[mods]
mods_rebuild = auto